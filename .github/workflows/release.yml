name: Release Delight Client

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-windows:
    if: github.actor == 'Parksdotjar'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Verify release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          $tagCommit = (git rev-parse HEAD).Trim()
          $mainCommit = (git rev-parse origin/main).Trim()
          if ($tagCommit -ne $mainCommit) {
            throw "Release tags must point at the current origin/main commit."
          }
          $expected = (Get-Content VERSION -Raw).Trim()
          if ($expected -ne $env:RELEASE_TAG) {
            throw "VERSION says $expected, but this release tag is $env:RELEASE_TAG. They must match exactly."
          }

      - run: npm ci
      - run: npm run version:sync

      - name: Compile Windows installer without signing credentials
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 release-unsigned.json
          npm run tauri:build -- --no-sign --config release-unsigned.json
          if ($LASTEXITCODE -ne 0) { throw "The unsigned installer build failed." }
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*_x64-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one x64 NSIS installer." }
          New-Item -ItemType Directory -Path release-handoff | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination release-handoff/installer.exe
          (Get-FileHash -Algorithm SHA256 release-handoff/installer.exe).Hash |
            Set-Content -Encoding ascii release-handoff/installer.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-x64
          path: release-handoff
          if-no-files-found: error

  sign-windows:
    needs: release-windows
    if: github.actor == 'Parksdotjar'
    runs-on: windows-latest
    environment: windows-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-windows-x64
          path: release-handoff

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20

      - name: Prepare fixed signer and verify unsigned artifact
        shell: pwsh
        run: |
          $expected = (Get-Content release-handoff/installer.sha256 -Raw).Trim()
          $actual = (Get-FileHash -Algorithm SHA256 release-handoff/installer.exe).Hash
          if ($expected -notmatch '^[0-9a-fA-F]{64}$' -or $expected -cne $actual) {
            throw "The unsigned installer digest did not match."
          }
          npm install --prefix signer --ignore-scripts --no-audit --no-fund --no-package-lock --save-exact @tauri-apps/cli@2.11.4
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the installer signer." }

      - name: Sign installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Expected a release version tag." }
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "Delight.Client_${version}_x64-setup.exe"
          Rename-Item -LiteralPath release-handoff/installer.exe -NewName $installer
          node signer/node_modules/@tauri-apps/cli/tauri.js signer sign "release-handoff/$installer"
          if ($LASTEXITCODE -ne 0) { throw "Could not sign the installer." }

      - name: Prepare updater manifest and draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "Delight.Client_${version}_x64-setup.exe"
          $signature = (Get-Content -LiteralPath "release-handoff/$installer.sig" -Raw).Trim()
          if (!$signature) { throw "The detached updater signature is missing." }
          $notes = "Publish this draft after verifying the signed installer and adding release notes."
          $entry = @{
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$installer"
            signature = $signature
          }
          @{
            version = $version
            notes = $notes
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = $entry; "windows-x86_64-nsis" = $entry }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release-handoff/latest.json
          gh release create $env:RELEASE_TAG "release-handoff/$installer" "release-handoff/$installer.sig" release-handoff/latest.json --verify-tag --draft --repo $env:GITHUB_REPOSITORY --title "Delight Client $env:RELEASE_TAG" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "The draft release could not be created." }
