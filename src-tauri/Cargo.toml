[package]
name = "bloomclient"
version = "1.3.6"
description = "An open-source Minecraft desktop client"
authors = ["Delight Client contributors"]
edition = "2021"

[lib]
name = "bloomclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
zip = "2"
sha2 = "0.10"
mc-launcher-core = "0.1.1"
same-file = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
keyring = { version = "3.6.3" }
tar = "0.4.46"
flate2 = "1"
fastnbt = "2.6.3"
base64 = "0.22"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
aes-gcm = "0.10"
rand = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
vodozemac = "0.11"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
junction = "1"
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = [
    "ApplicationModel", "Foundation", "Media_Control", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
    "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
local-cosmetics-test = []
