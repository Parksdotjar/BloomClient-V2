[package]
name = "sakura"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bloom's experimental native Minecraft client"

[workspace]
members = ["vendor/azalea-protocol"]
default-members = ["."]

[patch.crates-io]
azalea-protocol = { path = "vendor/azalea-protocol" }

[dependencies]
azalea-client = { version = "=0.16.0", default-features = false, features = ["online-mode", "packet-event"] }
azalea-auth = { version = "=0.16.0", default-features = false, features = ["online-mode"] }
azalea-protocol = { version = "=0.16.0", default-features = false, features = ["connecting", "bevy_ecs", "online-mode"] }
azalea-core = "=0.16.0"
azalea-entity = "=0.16.0"
azalea-world = "=0.16.0"
azalea-block = "=0.16.0"
azalea-physics = "=0.16.0"
bevy_app = "=0.18.1"
bevy_ecs = "=0.18.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
uuid = "1"
parking_lot = "0.12"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "socks"] }
wgpu = "=30.0.1"
winit = "=0.30.13"
glam = "=0.34.2"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "vorbis"] }
azalea-inventory = "=0.16.0"
azalea-registry = "=0.16.0"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

